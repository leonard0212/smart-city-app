# Ultralytics YOLO 🚀, AGPL-3.0 license
# Default YOLO tracker settings for ByteTrack tracker https://github.com/ifzhang/ByteTrack

tracker_type: bytetrack # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.55 # actualizează track-uri doar cu detecții mai sigure, 5 era 0.3  # 0.25 # threshold for the first association
track_low_thresh: 0.1  #20 era  0.15  ,0.1 # threshold for the second association
new_track_thresh: 0.55 #nu mai porni trackuri noi din boxuri foarte slabe,0,35 era 0.3 # threshold for init new track if the detection does not match any tracks
track_buffer: 150 #120 ≈4s la 30 FPS toleranță la ocluzii (dispariții)., era 50  #30 # buffer to calculate the time when to remove tracks
match_thresh: 0.58 # 0.6 permite asocieri și când IoU  scade între cadre la viteză mare,70 era 0.9 #1.0 #0.8 # threshold for matching tracks
fuse_score: True # Whether to fuse confidence scores with the iou distances before matching
# min_box_area: 10  # threshold for min box areas(for tracker evaluation, not used for now)
# BoT-SORT settings
gmc_method: orb # sparseOptFlow #orb  # method of global motion compensation
# ReID model related thresh (not supported yet)
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
